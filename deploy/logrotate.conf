# =============================================================================
# ICS31 Quiz Generator — logrotate configuration
#
# Install on the EC2 server:
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/ics31-quiz
#
# logrotate runs automatically via cron (typically daily at 6:25 AM).
# To test manually:  sudo logrotate -d /etc/logrotate.d/ics31-quiz
# To force rotate:   sudo logrotate -f /etc/logrotate.d/ics31-quiz
# =============================================================================

/home/ubuntu/ics31-quiz/logs/audit.log {
    # Rotate once per day
    daily

    # Keep 7 days of rotated logs
    rotate 7

    # Compress rotated logs with gzip
    compress

    # Don't compress the most-recently-rotated file (gives time for the
    # app to finish any writes before gzip kicks in on the next cycle)
    delaycompress

    # Don't error if the log file is missing
    missingok

    # Don't rotate if the log file is empty
    notifempty

    # Truncate the live log file in-place rather than moving it.
    # This avoids the need to restart the service after rotation, because
    # the app keeps its file descriptor pointing at the same inode.
    copytruncate

    # Optional: set ownership and permissions on the new (truncated) file
    create 0640 ubuntu ubuntu
}
