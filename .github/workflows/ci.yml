name: CI

# Run on every push to main and on all pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # test — run the pytest suite against the FastAPI backend
  #
  # Heavy dependencies (MoviePy, TikTok TTS, OpenAI) are fully mocked in
  # tests/conftest.py, so this job needs no real API keys or system media libs.
  # ---------------------------------------------------------------------------
  test:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev/test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # build-frontend — verify the React app compiles without errors
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build React app
        run: cd frontend && npm run build

      # The production bundle must call the API on its own origin. A hardcoded
      # http://localhost:8000 only works in a browser running on the server.
      # (Source maps contain the original source, so only *.js is checked.)
      - name: Check the build has no hardcoded API URL
        run: |
          if grep -l "localhost:8000" frontend/build/static/js/*.js; then
            echo "::error::The production bundle hardcodes http://localhost:8000"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          # Keep artifacts for 7 days so deploys can pull the latest build
          retention-days: 7
